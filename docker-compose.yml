services:
  db:
    image: mysql:8.0
    container_name: conductor_noise_2026_db
    restart: unless-stopped
    command: --max_allowed_packet=1073741824 --innodb_buffer_pool_size=256M
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: development
      MYSQL_USER: conductor_user
      MYSQL_PASSWORD: conductor_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_2026_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - conductor_2026_network

  db-migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.migrate
    container_name: conductor_noise_2026_migrate
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && python -m transpower_conductor_noise_tool_2026.backend.persistence.seed_cli"
    environment:
      - DATABASE_URL=mysql+pymysql://conductor_user:conductor_password@db:3306/development
      - SITE_FIXTURE_PATH=/app/data/site.csv
      - USER_FIXTURE_PATH=/app/data/user.csv
      - PROCESSED_READING_FIXTURE_PATH=/app/data/processed_reading.csv
      - OUTAGE_TYPE_FIXTURE_PATH=/app/data/outage_type.csv
      - OUTAGE_FIXTURE_PATH=/app/data/outage.csv
      - RECONDUCTORING_FIXTURE_PATH=/app/data/reconductoring.csv
      - HISTORICAL_RESULT_FIXTURE_PATH=/app/data/historical_result.csv
      - AUTO_INIT_DB=false
      - AUTO_SEED_DATA=false
    volumes:
      - ./data:/app/data
    networks:
      - conductor_2026_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conductor_noise_2026_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    ports:
      - "5001:5000"
    environment:
      - DATABASE_URL=mysql+pymysql://conductor_user:conductor_password@db:3306/development
      - SITE_FIXTURE_PATH=/app/data/site.csv
      - USER_FIXTURE_PATH=/app/data/user.csv
      - PROCESSED_READING_FIXTURE_PATH=/app/data/processed_reading.csv
      - OUTAGE_TYPE_FIXTURE_PATH=/app/data/outage_type.csv
      - OUTAGE_FIXTURE_PATH=/app/data/outage.csv
      - RECONDUCTORING_FIXTURE_PATH=/app/data/reconductoring.csv
      - HISTORICAL_RESULT_FIXTURE_PATH=/app/data/historical_result.csv
      - AUTO_INIT_DB=false
      - AUTO_SEED_DATA=false
    volumes:
      - ./data:/app/data
    networks:
      - conductor_2026_network

  # Ingests new readings from the Noise and Weather API. Opt-in only (needs real
  # NW_USERNAME/NW_PASSWORD credentials) - run with:
  #   docker compose --profile ingestion run --rm ingest
  ingest:
    build:
      context: .
      dockerfile: docker/Dockerfile.migrate
    container_name: conductor_noise_2026_ingest
    depends_on:
      db:
        condition: service_healthy
    command: python -m transpower_conductor_noise_tool_2026.backend.ingestion.ingest_cli
    environment:
      - DATABASE_URL=mysql+pymysql://conductor_user:conductor_password@db:3306/development
      - NW_USERNAME=${NW_USERNAME:-}
      - NW_PASSWORD=${NW_PASSWORD:-}
      - AUTO_INIT_DB=false
      - AUTO_SEED_DATA=false
    networks:
      - conductor_2026_network
    profiles:
      - ingestion

  # Optional - for production-like reverse proxy behavior
  nginx:
    image: nginx:alpine
    container_name: conductor_noise_2026_nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - conductor_2026_network
    profiles:
      - prodlike

volumes:
  mysql_2026_data:

networks:
  conductor_2026_network:
    driver: bridge
