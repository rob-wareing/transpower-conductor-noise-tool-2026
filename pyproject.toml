[tool.poetry]
name = "transpower-conductor-noise-tool-2026"
version = "0.1.0"
description = "Separated backend/frontend rebuild of the Transpower conductor noise tool"
authors = ["Altissimo NZ"]
readme = "README.md"
packages = [{ include = "transpower_conductor_noise_tool_2026", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
flask = "^3.0.3"
flask-sqlalchemy = "^3.1.1"
sqlalchemy = "^2.0.32"
alembic = "^1.13.2"
dash = "^2.17.1"
dash-bootstrap-components = "^1.6.0"
plotly = ">=5.22.0"
pandas = "^2.2.2"
requests = "^2.32.3"
pydantic = "^2.8.2"
python-dotenv = "^1.0.1"
pymysql = "^1.1.1"
gunicorn = "^22.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
ruff = "^0.6.2"
black = "^24.8.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
